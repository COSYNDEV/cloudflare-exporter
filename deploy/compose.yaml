name: cloudflare-exporter

services:
  exporter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.local
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in deploy/.env}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:?set CF_ACCOUNT_ID in deploy/.env}
      CF_ZONES: ${CF_ZONES:-}
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-}
      COLLECT_DELAY: ${COLLECT_DELAY:-}
    ports:
      - 127.0.0.1:${EXPORTER_PORT:-9184}:9184

  prometheus:
    image: prom/prometheus:v3.16.0
    depends_on:
      - exporter
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090

  grafana:
    image: grafana/grafana:13.3.1
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cloudflare-edge.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000

volumes:
  prometheus-data:
  grafana-data:
